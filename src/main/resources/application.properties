spring.application.name=alexa-demo

# Bind to loopback only; override explicitly (e.g. behind a TLS-terminating proxy) when deploying.
server.address=127.0.0.1

# The browser simulator cannot sign requests, so "local" is the default profile.
# Use SPRING_PROFILES_ACTIVE=prod for real Alexa traffic (signature + timestamp checks on).
spring.profiles.default=local

# Skill ID restriction. Leave empty to accept any skill; set ALEXA_SKILL_ID in real deployments.
alexa.skill-id=${ALEXA_SKILL_ID:}

# Secure by default; relaxed only in the "local" profile.
alexa.verification.enabled=true
alexa.verification.timestamp-tolerance=150s
