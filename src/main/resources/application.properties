spring.application.name=alexa-demo

# Bind to loopback only; override explicitly (e.g. behind a TLS-terminating proxy) when deploying.
server.address=127.0.0.1

# The browser simulator cannot sign requests, so "local" is the default profile.
# Use SPRING_PROFILES_ACTIVE=prod for real Alexa traffic (signature + timestamp checks on).
spring.profiles.default=local

# Skill ID restriction. Leave empty to accept any skill; set ALEXA_SKILL_ID in real deployments.
alexa.skill-id=${ALEXA_SKILL_ID:}

# Secure by default; relaxed only in the "local" profile.
alexa.verification.enabled=true
alexa.verification.timestamp-tolerance=150s

# --- Local model (Ollama). Nothing here is required for the Alexa webhook to work. ---
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
spring.ai.ollama.chat.options.model=${CHAT_MODEL:gemma:2b}
spring.ai.ollama.chat.options.temperature=0.2
# Keep the model resident between requests; reloading costs ~10s on this CPU.
spring.ai.ollama.chat.options.keep-alive=30m
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.ollama.init.timeout=5s
# Embedding model for the knowledge service (multilingual: English, Hindi, Odia).
# Off by default; the "knowledge" profile switches it on together with the database.
spring.ai.model.embedding=none
spring.ai.ollama.embedding.options.model=bge-m3
spring.ai.ollama.embedding.options.keep-alive=30m

# Inference limits - low concurrency on purpose (CPU inference slows down when over-subscribed).
assistant.gateway.max-concurrent=2
assistant.gateway.queue-timeout=2s
assistant.gateway.request-timeout=45s

# --- Operations ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
# A missing model degrades the app but must not mark it as down.
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
management.endpoint.health.status.http-mapping.DEGRADED=200

# --- Database (knowledge service). OFF by default so the Alexa simulator needs no infrastructure. ---
# Enable with SPRING_PROFILES_ACTIVE=local,knowledge (see application-knowledge.properties).
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
spring.flyway.enabled=false
