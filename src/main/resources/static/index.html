
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Alexa Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="logo">A</div>
            <h1>My Alexa Assistant</h1>
            <p>Your personal voice assistant</p>
        </div>

        <div class="assistant-circle" id="assistantCircle">
            <span>🎙️</span>
        </div>

        <p id="status">Click the microphone and start speaking</p>

        <div class="input-section">

            <input
                type="text"
                id="messageInput"
                placeholder="Type or speak something..."
            />

            <button id="sendButton">
                Send
            </button>

        </div>

        <button id="micButton" class="mic-button">
            🎤 Start Listening
        </button>

        <div class="result-section">

            <div class="result-card">
                <h3>You said</h3>
                <p id="recognizedText">Waiting for your message...</p>
            </div>

            <div class="result-card">
                <h3>Alexa response</h3>
                <p id="alexaResponse">Waiting for Alexa...</p>
            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
