global:
  scrape_interval: 15s

scrape_configs:
  - job_name: alexa-assistant
    metrics_path: /actuator/prometheus
    static_configs:
      # The app runs on the host and binds to loopback; Prometheus reaches it through the container
      # runtime's host alias. See README "Observability" for the one setting this needs.
      - targets: ["host.containers.internal:8080"]
