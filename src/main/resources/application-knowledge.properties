# Knowledge profile: PostgreSQL + pgvector with Flyway-managed schema.
# Activate with SPRING_PROFILES_ACTIVE=local,knowledge after `podman compose up -d postgres`.

# Re-enable the datasource that application.properties excludes by default.
spring.autoconfigure.exclude=
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.datasource.url=jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5432}/${POSTGRES_DB:assistant}
spring.datasource.username=${POSTGRES_USER:assistant}
# No default on purpose: startup fails fast if the secret is not provided.
spring.datasource.password=${POSTGRES_PASSWORD}

# Small, bounded pool: ingestion and chat share one database on a laptop.
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.max-lifetime=1500000
